<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonPayPulse | Registrace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, .font-heading { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-slate-950">

    <header class="border-b border-slate-800/80 bg-[#030712]/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="/index.html" class="flex items-center space-x-3">
                <div class="relative w-11 h-11 rounded-2xl bg-gradient-to-tr from-emerald-600 via-emerald-400 to-teal-300 flex items-center justify-center shadow-lg shadow-emerald-500/30">
                    <span class="text-slate-950 font-black text-2xl tracking-tighter">N</span>
                    <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-cyan-400 rounded-full border-2 border-slate-950 flex items-center justify-center text-[9px] text-slate-950 font-black">✓</div>
                </div>
                <span class="font-heading font-black text-2xl tracking-tight text-white">
                    Neon<span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-300">PayPulse</span>
                </span>
            </a>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 py-12 w-full flex-grow flex items-center">
        <div class="bg-slate-900/60 border border-slate-800/80 p-8 rounded-3xl backdrop-blur-xl shadow-2xl w-full space-y-6">
            <div class="space-y-2 text-center">
                <h1 class="text-3xl font-heading font-black text-white">Vytvořit účet</h1>
                <p class="text-xs text-slate-400">Zaregistruj se a začni budovat své portfolio.</p>
            </div>

            <form id="registerForm" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-300">Uživatelské jméno</label>
                    <input type="text" id="username" required class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-300">E-mailová adresa</label>
                    <input type="email" id="email" required class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition" placeholder="vas@email.cz">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-300">Heslo</label>
                    <input type="password" id="password" required class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
                
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-300">Referral kód (nepovinné)</label>
                    <input type="text" id="refCode" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition" placeholder="Např. jmeno1234">
                </div>

                <div class="flex items-start space-x-3 pt-2">
                    <input type="checkbox" id="terms" required class="mt-1 w-4 h-4 rounded bg-slate-950 border-slate-800 text-emerald-500 focus:ring-emerald-500 focus:ring-offset-slate-900 cursor-pointer">
                    <label for="terms" class="text-xs text-slate-400 leading-relaxed">
                        Souhlasím s <a href="/terms.html" target="_blank" class="text-emerald-400 font-bold hover:underline">obchodními podmínkami</a> a pravidly používání služby.
                    </label>
                </div>

                <div style="display:none;" aria-hidden="true">
                    <label>Website</label>
                    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                </div>

                <div id="error-msg" class="text-xs text-red-300 bg-red-950/50 border border-red-900/50 p-3 rounded-xl hidden leading-relaxed"></div>

                <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-heading font-black py-4 rounded-xl transition shadow-lg text-sm cursor-pointer mt-2">
                    Zaregistrovat se
                </button>
            </form>

            <div class="text-center text-xs text-slate-400">
                Už máš účet? <a href="/login.html" class="text-emerald-400 font-bold hover:underline">Přihlas se</a>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800/80 bg-slate-950/50 py-6 text-center text-xs text-slate-500 space-y-2">
        <p>
            <a href="/terms.html" class="hover:text-slate-300 underline">Obchodní podmínky</a>
        </p>
        <p>&copy; 2026 NeonPayPulse Ecosystem.</p>
    </footer>

    <script>
        let csrfToken = '';

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refParam = urlParams.get('ref');
            if (refParam) {
                document.getElementById('refCode').value = refParam;
            }

            try {
                const res = await fetch('/api/csrf-token', { credentials: 'include' });
                const data = await res.json();
                if (data.success) {
                    csrfToken = data.csrfToken;
                }
            } catch (err) {
                console.error('Nepodařilo se načíst CSRF token');
            }

            const form = document.getElementById('registerForm');
            if (form) {
                form.addEventListener('submit', handleRegister);
            }
        });

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const refCode = document.getElementById('refCode').value;
            const website = document.getElementById('website').value; // OPRAVENO ZDE
            const errorMsg = document.getElementById('error-msg');

            errorMsg.classList.add('hidden');
            errorMsg.innerText = '';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-csrf-token': csrfToken
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, email, password, refCode, website })
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = '/dashboard.html';
                } else {
                    errorMsg.innerText = data.error || 'Chyba při registraci';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = 'Chyba připojení k serveru.';
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
