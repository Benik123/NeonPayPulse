<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonPayPulse | Registrace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, .font-heading { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-slate-950">

    <header class="border-b border-slate-800/80 bg-[#030712]/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="/index.html" class="flex items-center space-x-3">
                <div class="relative w-11 h-11 rounded-2xl bg-gradient-to-tr from-emerald-600 via-emerald-400 to-teal-300 flex items-center justify-center shadow-lg shadow-emerald-500/30">
                    <span class="text-slate-950 font-black text-2xl tracking-tighter">N</span>
                </div>
                <span class="font-heading font-black text-2xl tracking-tight text-white">
                    Neon<span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-300">PayPulse</span>
                </span>
            </a>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 py-12 w-full flex-grow flex items-center">
        <div class="bg-slate-900/60 border border-slate-800/80 p-8 rounded-3xl backdrop-blur-xl shadow-2xl w-full space-y-6">
            <div class="space-y-2 text-center">
                <h1 class="text-3xl font-heading font-black text-white">Registrace</h1>
                <p class="text-xs text-slate-400">Vytvoř si účet a začni vydělávat bez vkladu.</p>
            </div>

            <form id="registerForm" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-300">Uživatelské jméno</label>
                    <input type="text" id="username" required class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-300">E-mailová adresa</label>
                    <input type="email" id="email" required class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                </div>

                <!-- Políčko pro heslo s emoji ikonou -->
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-300">Heslo</label>
                    <div class="relative">
                        <input type="password" id="password" required class="w-full bg-slate-950/85 border border-slate-800 rounded-xl px-4 py-3 pr-12 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 px-3.5 flex items-center justify-center text-lg focus:outline-none transition cursor-pointer select-none">
                            👁️
                        </button>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-300">Referral kód (nepovinné)</label>
                    <input type="text" id="refCode" placeholder="Např. NPP-1234" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div id="error-msg" class="text-xs text-red-400 hidden p-2 bg-red-950/30 rounded-lg text-center"></div>

                <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-heading font-black py-4 rounded-xl transition shadow-lg text-sm cursor-pointer mt-2">
                    Zaregistrovat se
                </button>
            </form>

            <div class="text-center text-xs text-slate-400">
                Už máš účet? <a href="/login.html" class="text-emerald-400 font-bold hover:underline">Přihlas se</a>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800/80 bg-slate-950/50 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 NeonPayPulse Ecosystem.</p>
    </footer>

    <script>
        let csrfToken = '';

        window.addEventListener('DOMContentLoaded', async () => {
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', () => {
                    const currentType = passwordInput.getAttribute('type');
                    if (currentType === 'password') {
                        passwordInput.setAttribute('type', 'text');
                        togglePasswordBtn.innerText = '🔒'; // Když je heslo vidět
                    } else {
                        passwordInput.setAttribute('type', 'password');
                        togglePasswordBtn.innerText = '👁️'; // Když je heslo skryté
                    }
                });
            }

            // Automatické vyplnění ref kódu z URL adresy (např. ?ref=XYZ)
            const urlParams = new URLSearchParams(window.location.search);
            const refFromUrl = urlParams.get('ref');
            if (refFromUrl) {
                const refInput = document.getElementById('refCode');
                if (refInput) {
                    refInput.value = refFromUrl;
                }
            }

            try {
                const res = await fetch('/api/csrf-token', { credentials: 'include' });
                const data = await res.json();
                if (data.success) {
                    csrfToken = data.csrfToken;
                }
            } catch (err) {
                console.error('Nepodařilo se načíst CSRF token:', err);
            }

            const form = document.getElementById('registerForm');
            if (form) {
                form.addEventListener('submit', handleRegister);
            }
        });

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const refCode = document.getElementById('refCode').value.trim();
            const errorMsg = document.getElementById('error-msg');

            errorMsg.classList.add('hidden');
            errorMsg.innerText = "Registruji účet...";
            errorMsg.classList.remove('hidden');

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-csrf-token': csrfToken
                    },
                    credentials: 'include', 
                    body: JSON.stringify({ username, email, password, refCode })
                });
                
                const data = await res.json();

                if (data.success) {
                    window.location.href = '/dashboard.html';
                } else {
                    errorMsg.innerText = data.error || 'Registrace se nezdařila';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                console.error("Chyba:", err);
                errorMsg.innerText = 'Chyba připojení k serveru. Zkontroluj internet.';
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
