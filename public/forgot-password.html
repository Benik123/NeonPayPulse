<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonPayPulse | Zapomenuté heslo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, .font-heading { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-slate-950">

    <header class="border-b border-slate-800/80 bg-[#030712]/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="/index.html" class="flex items-center space-x-3">
                <div class="relative w-11 h-11 rounded-2xl bg-gradient-to-tr from-emerald-600 via-emerald-400 to-teal-300 flex items-center justify-center shadow-lg shadow-emerald-500/30">
                    <span class="text-slate-950 font-black text-2xl tracking-tighter">N</span>
                    <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-cyan-400 rounded-full border-2 border-slate-950 flex items-center justify-center text-[9px] text-slate-950 font-black">✓</div>
                </div>
                <span class="font-heading font-black text-2xl tracking-tight text-white">
                    Neon<span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-300">PayPulse</span>
                </span>
            </a>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 py-12 w-full flex-grow flex items-center">
        <div class="bg-slate-900/60 border border-slate-800/80 p-8 rounded-3xl backdrop-blur-xl shadow-2xl w-full space-y-6">
            <div class="space-y-2 text-center">
                <h1 class="text-3xl font-heading font-black text-white">Zapomenuté heslo</h1>
                <p class="text-xs text-slate-400">Zadej svůj e-mail a my ti pošleme odkaz pro obnovení hesla.</p>
            </div>

            <form id="forgotForm" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-300">E-mail</label>
                    <input type="email" id="email" required class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div id="message" class="text-xs hidden p-3 rounded-xl"></div>

                <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-heading font-black py-4 rounded-xl transition shadow-lg text-sm cursor-pointer mt-2">
                    Odeslat odkaz
                </button>
            </form>

            <div class="text-center text-xs text-slate-400">
                Vzpomněl sis? <a href="login.html" class="text-emerald-400 font-bold hover:underline">Přihlas se</a>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800/80 bg-slate-950/50 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 NeonPayPulse Ecosystem.</p>
    </footer>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');

            messageDiv.className = 'text-xs p-3 rounded-xl bg-slate-800 text-slate-300';
            messageDiv.textContent = 'Odesílám požadavek...';
            messageDiv.classList.remove('hidden');

            try {
                const response = await fetch('/api/request-password-reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                
                if (data.success) {
                    messageDiv.className = 'text-xs p-3 rounded-xl bg-emerald-950/50 border border-emerald-500/30 text-emerald-400';
                    messageDiv.textContent = data.message;
                } else {
                    messageDiv.className = 'text-xs p-3 rounded-xl bg-red-950/50 border border-red-500/30 text-red-400';
                    messageDiv.textContent = data.error || 'Něco se pokazilo.';
                }
            } catch (err) {
                messageDiv.className = 'text-xs p-3 rounded-xl bg-red-950/50 border border-red-500/30 text-red-400';
                messageDiv.textContent = 'Chyba připojení k serveru.';
            }
        });
    </script>
</body>
</html>
